version: "3.8"
services:
  db:
    image: mysql:8.0
    container_name: digipocket-db
    environment:
      MYSQL_DATABASE: digipocket
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: dp_user
      MYSQL_PASSWORD: dp_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: digipocket-app
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/digipocket
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      APP_JWT_SECRET: ZGV2LXNlY3JldC1iYXNlNjQtMzItYnl0ZS1rZXk9PT09PT09
      APP_JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"

volumes:
  db_data:
